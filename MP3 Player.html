<!doctype html>
<html><head><meta charset="utf-8"><title>MP3 Player 1.0</title>
<style>
body{font-family:Segoe UI,sans-serif;background:#1e1f24;color:#eee;margin:0;padding:24px;max-width:760px;margin:auto}
h1{font-size:20px;margin:0 0 16px}
#drop{border:2px dashed #666;border-radius:10px;padding:18px;text-align:center;cursor:pointer;color:#aaa}
#drop.over{border-color:#4ea1ff;color:#fff}
#now{font-size:17px;margin:18px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:24px}
.row{display:flex;gap:10px;align-items:center;margin:8px 0}
#seek{flex:1}
input[type=range]{accent-color:#4ea1ff}
.t{color:#aaa;font-variant-numeric:tabular-nums;width:48px;text-align:center}
button{background:#3a3d46;color:#eee;border:0;border-radius:6px;padding:8px 14px;cursor:pointer;font-size:16px}
button:hover{background:#4a4e59}
button.on{background:#2f6fb5}
#play{background:#2f7d32;width:60px}
ul{list-style:none;padding:0;margin:16px 0;max-height:55vh;overflow:auto}
li{display:flex;align-items:center;gap:8px;background:#2a2c33;margin:3px 0;padding:7px 10px;border-radius:6px;cursor:pointer}
li:hover{background:#33363e}
li.cur{background:#24456b}
li span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li button{padding:2px 8px;font-size:13px}
small{color:#888}
</style></head><body>
<h1>MP3 Player 1.0</h1>
<div id="drop">Drop audio files here or click to pick (adds to playlist)<input id="pick" type="file" accept="audio/*,.mp3" multiple hidden></div>
<div id="now">Nothing playing</div>
<div class="row"><span class="t" id="cur">0:00</span><input id="seek" type="range" min="0" max="1000" value="0"><span class="t" id="dur">0:00</span></div>
<div class="row">
  <button id="prev" title="Previous (P)">⏮</button>
  <button id="play" title="Play/Pause (Space)">▶</button>
  <button id="next" title="Next (N)">⏭</button>
  <button id="shuf" title="Shuffle (S)">🔀</button>
  <button id="rep" title="Repeat: off / all / one (R)">🔁</button>
  <span style="flex:1"></span>
  🔊 <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8" style="width:120px">
  <button id="clear">Clear</button>
</div>
<small>Keys: Space play/pause · ←/→ seek 5 s · ↑/↓ volume · N next · P previous · S shuffle · R repeat</small>
<ul id="list"></ul>
<audio id="a"></audio>
<script>
const $=id=>document.getElementById(id),a=$('a');
let tracks=[],idx=-1,shuffle=false,repeat=0,seeking=false;// repeat 0 off,1 all,2 one
a.volume=+(localStorage.mp3vol??0.8);$('vol').value=a.volume;
const drop=$('drop'),pick=$('pick');
drop.onclick=()=>pick.click();
pick.onchange=()=>{add(pick.files);pick.value=''};
document.body.ondragover=e=>{e.preventDefault();drop.classList.add('over')};
document.body.ondragleave=e=>{if(!e.relatedTarget)drop.classList.remove('over')};
document.body.ondrop=e=>{e.preventDefault();drop.classList.remove('over');add(e.dataTransfer.files)};
function add(fl){
  const start=tracks.length;
  for(const f of fl)if(f.type.startsWith('audio/')||/\.(mp3|m4a|wav|ogg|flac|aac|opus)$/i.test(f.name))
    tracks.push({name:f.name.replace(/\.[^.]+$/,''),url:URL.createObjectURL(f)});
  render();if(idx<0&&tracks.length>start)load(start,true);
}
const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
function render(){
  const ul=$('list');ul.innerHTML='';
  tracks.forEach((t,i)=>{
    const li=document.createElement('li');if(i===idx)li.className='cur';
    li.innerHTML=`<b>${i+1}.</b><span></span>`;li.querySelector('span').textContent=t.name;
    li.onclick=()=>load(i,true);
    const x=document.createElement('button');x.textContent='✕';
    x.onclick=e=>{e.stopPropagation();URL.revokeObjectURL(t.url);tracks.splice(i,1);
      if(i===idx){a.pause();a.removeAttribute('src');idx=-1;$('now').textContent='Nothing playing';if(tracks.length)load(Math.min(i,tracks.length-1),false)}
      else if(i<idx)idx--;render()};
    li.appendChild(x);ul.appendChild(li);
  });
}
function load(i,play){
  if(!tracks.length)return;idx=i;a.src=tracks[i].url;$('now').textContent='♪ '+tracks[i].name;
  document.title=tracks[i].name+' - MP3 Player 1.0';
  if(play)a.play();render();
}
function nextIdx(dir){
  if(shuffle&&tracks.length>1){let j;do j=Math.floor(Math.random()*tracks.length);while(j===idx);return j}
  const j=idx+dir;if(j>=tracks.length)return repeat===1?0:-1;if(j<0)return repeat===1?tracks.length-1:0;return j;
}
function next(){const j=nextIdx(1);if(j>=0)load(j,true)}
function prev(){if(a.currentTime>3){a.currentTime=0;return}const j=nextIdx(-1);if(j>=0)load(j,true)}
function toggle(){if(idx<0){if(tracks.length)load(0,true);return}a.paused?a.play():a.pause()}
a.onended=()=>{if(repeat===2){a.currentTime=0;a.play()}else next()};
a.onplay=()=>$('play').textContent='⏸';
a.onpause=()=>$('play').textContent='▶';
a.ontimeupdate=()=>{$('cur').textContent=fmt(a.currentTime);if(!seeking&&a.duration)$('seek').value=a.currentTime/a.duration*1000};
a.onloadedmetadata=()=>$('dur').textContent=fmt(a.duration);
$('seek').oninput=()=>{seeking=true;if(a.duration)$('cur').textContent=fmt($('seek').value/1000*a.duration)};
$('seek').onchange=()=>{if(a.duration)a.currentTime=$('seek').value/1000*a.duration;seeking=false};
$('vol').oninput=()=>{a.volume=$('vol').value;localStorage.mp3vol=a.volume};
$('play').onclick=toggle;$('next').onclick=next;$('prev').onclick=prev;
$('shuf').onclick=()=>{shuffle=!shuffle;$('shuf').classList.toggle('on',shuffle)};
$('rep').onclick=()=>{repeat=(repeat+1)%3;$('rep').classList.toggle('on',repeat>0);$('rep').textContent=repeat===2?'🔂':'🔁'};
$('clear').onclick=()=>{a.pause();a.removeAttribute('src');tracks.forEach(t=>URL.revokeObjectURL(t.url));tracks=[];idx=-1;
  $('now').textContent='Nothing playing';$('cur').textContent=$('dur').textContent='0:00';$('seek').value=0;render()};
document.onkeydown=e=>{
  if(e.target.tagName==='INPUT'&&e.target.type!=='range')return;
  const k=e.key;
  if(k===' '){e.preventDefault();toggle()}
  else if(k==='ArrowRight'){e.preventDefault();a.currentTime=Math.min(a.duration||0,a.currentTime+5)}
  else if(k==='ArrowLeft'){e.preventDefault();a.currentTime=Math.max(0,a.currentTime-5)}
  else if(k==='ArrowUp'){e.preventDefault();a.volume=Math.min(1,a.volume+0.05);$('vol').value=a.volume;localStorage.mp3vol=a.volume}
  else if(k==='ArrowDown'){e.preventDefault();a.volume=Math.max(0,a.volume-0.05);$('vol').value=a.volume;localStorage.mp3vol=a.volume}
  else if(k==='n'||k==='N')next();else if(k==='p'||k==='P')prev();
  else if(k==='s'||k==='S')$('shuf').click();else if(k==='r'||k==='R')$('rep').click();
};
if('mediaSession'in navigator){
  navigator.mediaSession.setActionHandler('nexttrack',next);
  navigator.mediaSession.setActionHandler('previoustrack',prev);
}
</script></body></html>
